<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="AIRFlow: a read-only online viewer for AI Routing Flow workflows.">
  <title>AIRFlow Viewer | AI Routing Flow</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js"></script>
  <script defer src="js/viewer.js"></script>
</head>
<body>
  <header class="header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">A/</span><div><h1>AIRFlow Viewer</h1><p>AI Routing Flow &middot; Online viewer</p></div></div>
    <label class="theme-switch"><input id="theme" type="checkbox" role="switch"><span>Dark theme</span></label>
  </header>
  <main class="viewer-layout">
    <aside class="sidebar">
      <details id="workflow-navigation" open>
        <summary>Workflows</summary>
        <p id="navigation-status" role="status">Loading workflows...</p>
        <nav aria-label="Workflows"><ul id="workflow-tree" class="workflow-tree"></ul></nav>
      </details>
    </aside>
    <div class="viewer-content">
    <section class="workspace" aria-label="Workflow viewer">
      <div class="toolbar">
        <div class="file-actions"><a id="raw-link" href="flows/project.air.mmd" target="_blank" rel="noopener">Raw source <span aria-hidden="true">&#8599;</span></a><button id="download" class="download" disabled><span aria-hidden="true">&#8595;</span> Download</button></div>
      </div>
      <nav class="breadcrumbs" aria-label="Workflow hierarchy"><ol id="breadcrumbs"></ol><span class="viewer-mode">Read-only</span></nav>
      <div class="diagram-heading"><h2 id="flow-title">project<span>.air.mmd</span></h2><span id="status" role="status" aria-live="polite">Loading workflow...</span></div>
      <div id="viewport" class="viewport" tabindex="0" aria-label="Workflow diagram" aria-busy="true">
        <div id="diagram" class="diagram"></div>
        <div id="message" class="message" role="alert" hidden></div>
        <div class="zoom-controls" role="group" aria-label="Diagram zoom">
          <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out" disabled>&minus;</button>
          <output id="zoom-level" aria-label="Zoom level">100%</output>
          <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in" disabled>+</button>
          <span class="divider"></span>
          <button id="reset" type="button" title="Fit diagram" aria-label="Fit diagram" disabled>&#10530;</button>
        </div>
      </div>
    </section>
    <details class="source-panel" id="source-panel">
      <summary>Mermaid source <span class="source-extension">Read-only &middot; .air.mmd</span></summary>
      <div class="source-toolbar"><span id="source-name">project.air.mmd</span><button id="copy" type="button" disabled>Copy source</button></div>
      <pre><code id="source"></code></pre>
    </details>
    </div>
  </main>
  <footer><span>AIRFlow <span class="footer-dot" aria-hidden="true">/</span> AI Routing Flow</span><span>One source. Human &amp; AI.</span></footer>
</body>
</html>
