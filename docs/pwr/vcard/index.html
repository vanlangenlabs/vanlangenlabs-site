<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contactgegevens – Jeroen van Langen</title>
</head>
<body>
  <h1>Jeroen van Langen</h1>

  <a href="pwrpack.vcf">Contact opslaan</a>
  <div id="qr"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const contactUrl = new URL("/pwrpack.vcf", location.origin).href;

    new QRCode(document.getElementById("qr"), {
      text: contactUrl,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
