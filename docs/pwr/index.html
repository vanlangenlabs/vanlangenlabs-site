<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15a05c">
  <title>Contactgegevens – Jeroen van Langen</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f7f4;
      --surface: #ffffff;
      --text: #18211c;
      --muted: #66746c;
      --accent: #15a05c;
      --border: #dfe8e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top left, rgba(21, 160, 92, 0.14), transparent 34rem),
        linear-gradient(180deg, #fbfcfa 0%, var(--background) 100%);
      color: var(--text);
      font-family: "Aptos", "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 760px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1;
      font-weight: 700;
    }

    .actions {
      margin: 18px 0 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid color-mix(in srgb, var(--accent), black 8%);
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(21, 160, 92, 0.22);
    }

    .qr-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      width: min(100%, 338px);
      margin: 0 auto;
    }

    figure {
      margin: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface), transparent 4%);
      box-shadow: 0 18px 45px rgba(24, 33, 28, 0.08);
    }

    figure img {
      display: block;
      width: min(100%, 300px);
      height: auto;
      margin: 0 auto;
      border: 1px solid var(--border);
    }

    figcaption {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main>
    <h1>Jeroen van Langen</h1>
    <h2>PWR Pack International B.V.</h2>
    <h3>Software Product Architect</h3>
    <p class="actions"><a class="button" href="pwr.vcf">Contact opslaan</a></p>

    <section class="qr-grid" aria-label="QR-codes">
      <figure>
        <img src="vcard.png" alt="Offline QR-code met vCard-gegevens" width="300" height="300">
        <figcaption>Scan to save my contact details<br/><i>(offline contact card)</i></figcaption>
      </figure>

      <figure>
        <img src="vcard-url.png" alt="Online QR-code naar vCard URL" width="300" height="300">
        <figcaption>Scan to save my contact details<br/><i>(online fallback)</i></figcaption>
      </figure>
    </section>
  </main>
  <script>
  navigator.serviceWorker.register("sw.js?v=6", { updateViaCache: "none" });
</script>
</body>
</html>
